name: Security scans

on:
  workflow_call:
    inputs:
      job_runner:
        description: "GitHub action Jobs runtime. For example GitHub default runtimes like ubuntu-latest or you custome runtime. Default = ubuntu-latest"
        type: string
        required: false
        default: "ubuntu-latest"
      excluded_jobs:
        type: string
        default: ""
      semgrep_options:
        type: string
        default: ""
      security_scan_before_step_command:
        type: string
        default: ""
      security_scan_after_step_command:
        type: string
        default: ""
      sbom_container_image:
        description: "Container image for the generate_sbom, license_scan and dependency_scan jobs. Use ghcr.io/studiographene/ci:node-22-alpine-sbom for pnpm lockfile v9 support."
        type: string
        default: "ghcr.io/studiographene/ci:node-22-alpine"
      cdxgen_print:
        description: "Pass -p to cdxgen to print the SBOM table in the log. Set to false with node-22-alpine-sbom (cdxgen 12.9.3 crashes while printing at spec 1.5)."
        type: boolean
        default: true

jobs:
  SAST:
    name: sast
    runs-on: ${{ inputs.job_runner }}
    permissions:
      packages: read
      contents: read
      issues: write
      discussions: write
      pull-requests: write
      security-events: write
    if: ${{ !(contains(fromJSON('["github-actions[bot]", "dependabot[bot]"]'), github.actor)) && (github.event_name != 'issue_comment') && !contains(inputs.excluded_jobs, 'sast') }}
    container:
      image: ghcr.io/studiographene/ci:node-22-alpine
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: SAST before step
        if: ${{ inputs.security_scan_before_step_command != '' }}
        run: |
          ${{ inputs.security_scan_before_step_command}}
      - name: SAST Scan using Semgrep
        id: generate_sast_report
        run: |
          set +e
          cp /root/configs/semgrep/rules/eslint.v1.3.32.yml eslint.v1.3.32.yml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan --error --config  "p/default" --config eslint.v1.3.32.yml --json ${{ inputs.semgrep_options }}  > semgrep.json
          SEMGREP_EXIT_CODE=$?
          set -e
          if [ $SEMGREP_EXIT_CODE -ne 0 ]; then
            echo "## Semgrep SAST Scan Report" > sast_report.md
            echo "### Below are the vulnerabilities found in the code. Please resolve these before merging the pull request: " >> sast_report.md
            echo "| Rule Id | Severity |  Message | Line Number | File Name |" >> sast_report.md
            echo "| --- | --- | --- | --- | --- |" >> sast_report.md
            echo 'const fs = require("fs");
            const semgrepFile = fs.readFileSync("semgrep.json", "utf8");
            const semgrepData = JSON.parse(semgrepFile);
            for (const result of semgrepData.results) {
              let ruleId = result.check_id.replaceAll(",",";");
              ruleId = ruleId.replaceAll("\n","");
              let message = result.extra.message.replaceAll(",", ";");
              message = message.replaceAll("\n","");
              const severity = result.extra.severity;
              const lineNumber = result.start.line;
              const fileName = result.path;
              console.log("| " + ruleId + " | "  + severity + "|" + message +" | " + lineNumber + " | " + fileName + " |");
            }' > sast_report_format.cjs
            node sast_report_format.cjs >> sast_report.md
          else
            echo "## Semgrep SAST Scan Report" > sast_report.md
            echo "### :tada:! There are no vulnerabilities found in the code." >> sast_report.md
          fi
          if [ $SEMGREP_EXIT_CODE != 0 ]; then
            echo "::error::Vulnerabilities found! Find the scan report in the PR comment if this scan was triggered by PR"
            exit 1
          elif [ $SEMGREP_EXIT_CODE == 0 ]; then
            exit 0
          fi
      - name: Comment SAST report on PR
        if: ${{ !cancelled() }}
        uses: mshick/add-pr-comment@v2
        with:
          message-id: sast-scan
          message-path: sast_report.md

  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.job_runner }}
    permissions:
      contents: read
      packages: read
    if: ${{ !(contains(fromJSON('["github-actions[bot]", "dependabot[bot]"]'), github.actor)) && (github.event_name != 'issue_comment') && !contains(inputs.excluded_jobs, 'gitleaks') }}
    container:
      image: ghcr.io/studiographene/ci:node-22-alpine
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history. The old shallow checkout left gitleaks with 0 commits to scan.
          fetch-depth: 0
          # The PR head, not the merge ref, which doesn't exist when a PR has conflicts.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install gitleaks
        id: install
        shell: sh
        env:
          GITLEAKS_VERSION: "8.30.1"
          # From gitleaks_8.30.1_checksums.txt in the GitHub release.
          GITLEAKS_SHA256_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_SHA256_LINUX_ARM64: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) arch=x64; sum="$GITLEAKS_SHA256_LINUX_X64" ;;
            aarch64 | arm64) arch=arm64; sum="$GITLEAKS_SHA256_LINUX_ARM64" ;;
            *) echo "::error title=Gitleaks::Unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/gitleaks"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          mkdir -p "$dir"
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL -o "$dir/gitleaks.tar.gz" "$url"
          else
            wget -q -O "$dir/gitleaks.tar.gz" "$url"
          fi
          echo "$sum  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
          # The job container's user doesn't own the checkout, so git would refuse it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Gitleaks scan of new commits
        shell: sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -n "$BASE_SHA" ]; then
            # Pull request: only the commits it adds.
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$BASE_SHA"
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # Push: the commits since the previous tip.
            range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            # New branch, force-push or other event: the commits that aren't on any other branch.
            echo "::notice title=Gitleaks::No previous commit to compare with, so scanning the commits that aren't on any other branch."
            range="${HEAD_SHA} --not --exclude=origin/${REF_NAME} --remotes=origin"
          fi
          # gitleaks exits 0 when git itself fails, so check the range with git first.
          # shellcheck disable=SC2086 # range holds several git arguments
          count=$(git rev-list --count $range) || { echo "::error title=Gitleaks::Couldn't list the commits to scan (see the log)."; exit 1; }
          echo "Scanning ${count} commit(s): git log ${range}"
          # remerge skips octopus merges (3+ parents), so their own changes can't be scanned: fail closed.
          # shellcheck disable=SC2086
          octopus=$(git rev-list --count --min-parents=3 $range)
          if [ "$octopus" -gt 0 ]; then
            echo "::error title=Gitleaks::The new commits include ${octopus} octopus merge(s) (3+ parents), which gitleaks can't scan. Use ordinary two-parent merges instead."
            exit 1
          fi
          # remerge also scans what a merge commit adds itself (conflict resolutions), not what it merges in.
          if ! gitleaks git --no-banner --redact --verbose --log-opts="${range} --diff-merges=remerge" .; then
            echo "::error title=Gitleaks::Possible secret in the new commits (or gitleaks failed: see the log). Real secret: rotate it and remove it from the branch history. False positive: add a gitleaks:allow comment on that line, or add file:rule:line to .gitleaksignore."
            exit 1
          fi

      - name: Gitleaks scan of full history (warning only)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        shell: sh
        run: |
          set -eu
          # gitleaks exits 0 when git itself fails, so check the repo with git first.
          # remerge also scans what merge commits add themselves (conflict resolutions).
          if ! git rev-parse --verify --quiet HEAD >/dev/null \
            || ! gitleaks git --no-banner --redact --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json" \
              --log-opts="--full-history --all --diff-merges=remerge" .; then
            echo "::warning title=Gitleaks history::The history scan failed (see the log), so this run has no history report."
            exit 0
          fi
          octopus=$(git rev-list --all --min-parents=3 --count)
          OCTOPUS="$octopus" node <<'JS'
          const fs = require('fs');
          const findings = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/gitleaks-history.json`, 'utf8')) || [];
          const out = [];
          if (findings.length === 0) {
            out.push('### Gitleaks: no secrets found in git history');
          } else {
            console.log(`::warning title=Gitleaks history::${findings.length} possible secret(s) in git history (all branches). This doesn't block the PR. See the job summary.`);
            const cell = (v) => String(v ?? '').replace(/\|/g, '\\|');
            out.push(
              `### Gitleaks: ${findings.length} possible secret(s) in git history`,
              '',
              "This doesn't block the PR. For each real secret: rotate the credential, then add its fingerprint to `.gitleaksignore` in the repo root. Values are redacted.",
              '',
              '| Rule | File | Line | Commit | Date | Fingerprint |',
              '|---|---|---|---|---|---|',
            );
            for (const f of findings.slice(0, 200)) {
              out.push(`| ${cell(f.RuleID)} | ${cell(f.File)} | ${cell(f.StartLine)} | ${cell(f.Commit).slice(0, 8)} | ${cell(f.Date).slice(0, 10)} | \`${cell(f.Fingerprint)}\` |`);
            }
            if (findings.length > 200) out.push('', `Showing the first 200 of ${findings.length}.`);
          }
          const octopus = Number(process.env.OCTOPUS || 0);
          if (octopus > 0) out.push('', `Note: ${octopus} octopus merge(s) (3+ parents) weren't scanned for changes made in the merge itself.`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${out.join('\n')}\n`);
          JS

  generate_sbom:
    name: generate_sbom
    runs-on: ${{ inputs.job_runner }}
    permissions:
      packages: read
      contents: read
      issues: write
      discussions: write
      pull-requests: write
      security-events: write
    if: ${{ !(contains(fromJSON('["github-actions[bot]", "dependabot[bot]"]'), github.actor)) && (github.event_name != 'issue_comment') && !contains(inputs.excluded_jobs, 'dependency_scan') }}
    container:
      image: ${{ inputs.sbom_container_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Check for composer.lock or composer.json
        id: check_files
        run: |
          if [ -f composer.lock ] || [ -f composer.json ]; then
            echo "Files exist"
            echo "SKIP_DOWNLOAD_LOCKFILE=true" >> $GITHUB_OUTPUT
          else
            echo "Files do not exist"
            echo "SKIP_DOWNLOAD_LOCKFILE=false" >> $GITHUB_OUTPUT
          fi
      - name: Download package_lockFile Artifact
        if: ${{ !cancelled() && steps.check_files.outputs.SKIP_DOWNLOAD_LOCKFILE != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: package_lockFile
          path: .
      - name: Generate SBOM using CycloneDX
        if: always ()
        run: |
          cdxgen --version
          npm install -g @cyclonedx/cdxgen-plugins-bin
          cdxgen --no-recurse -o bom.xml ${{ inputs.cdxgen_print && '-p' || '' }} --debug
          ls -al
        env:
          FETCH_LICENSE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CDXGEN_DEBUG_MODE: debug

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.xml

  license_scan:
    name: license_scan
    runs-on: ${{ inputs.job_runner }}
    needs: generate_sbom
    permissions:
      packages: read
      contents: read
      issues: write
      discussions: write
      pull-requests: write
      security-events: write
    if: ${{ !(contains(fromJSON('["github-actions[bot]", "dependabot[bot]"]'), github.actor)) && (github.event_name != 'issue_comment') && !contains(inputs.excluded_jobs, 'license_scan') }}
    container:
      image: ${{ inputs.sbom_container_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Download SBOM Artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: License Scan
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          DEFAULT_ALLOWED_LICENSES: |
            Apache-2.0
            MIT
            MIT-0
            BSD-2-Clause
            BSD-3-Clause
            ISC
            0BSD
            CC-BY-4.0
            BlueOak-1.0.0
            No-Licence
            Unlicense
            Python-2.0
            CC-BY-3.0
            CC0-1.0
            MPL-2.0
            CC-BY-4.0
            Unicode-DFS-2016
            LGPL-3.0-or-later
            ODC-By-1.0
            WTFPL
        if: ${{ !cancelled() && !contains( inputs.excluded_jobs, 'license_scan' ) }}
        run: |
          cat > allowedLicenses.txt <<EOF
              $DEFAULT_ALLOWED_LICENSES
          EOF
          cat >> allowedLicenses.txt <<EOF
              ${{ vars.ALLOWED_LICENSES }}
          EOF
          /root/executables/ci-utility check --sbom bom.xml --allowedLicences allowedLicenses.txt

  dependency_scan:
    needs: generate_sbom
    name: dependency_scan
    runs-on: ${{ inputs.job_runner }}
    permissions:
      packages: read
      contents: read
      issues: write
      discussions: write
      pull-requests: write
      security-events: write
    if: ${{ !(contains(fromJSON('["github-actions[bot]", "dependabot[bot]"]'), github.actor)) && (github.event_name != 'issue_comment') && !contains( inputs.excluded_jobs, 'dependency_scan' ) }}
    container:
      image: ${{ inputs.sbom_container_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Download SBOM Artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .
      - name: Dependency Scan using Google OSV
        id: dependency_scan
        run: |
          cat >> dep_scan_suppression_config.toml <<EOF
              ${{ vars.OSV_SUPPRESSIONS }}
          EOF
          set +e
          osv-scanner --format markdown --config=./dep_scan_suppression_config.toml --sbom=bom.xml > osv_raw_report.md
          # JSON report is generated to segregate the vulnerabilities based on the CVSS score
          osv-scanner --format json --config=./dep_scan_suppression_config.toml --sbom=bom.xml > osv_raw_report.json
          echo "OSV_EXIT_CODE=$?" >> $GITHUB_OUTPUT
          set -e
      - name: Generate Dependency Scan Report
        id: generate_dependency_scan_report
        env:
          OSV_EXIT_CODE: ${{ steps.dependency_scan.outputs.OSV_EXIT_CODE }}
        run: |
          if [ $OSV_EXIT_CODE -ne 0 ]; then
            echo "Executing IF statement (vulnerabilities found)"
            SEVERITY_COUNTS=$(jq -r ' [.results[].packages[]? | select(.groups != null) | .groups[]?.max_severity ]
              | [
                  (map(select(test("^[0-9.]+$")) | tonumber | select(. < 4)) | length),
                  (map(select(test("^[0-9.]+$")) | tonumber | select(. >= 4 and . <= 7)) | length),
                  (map(select(test("^[0-9.]+$")) | tonumber | select(. > 7)) | length),
                  (map(select((. == "") or (test("^[0-9.]+$") | not))) | length)
                ] 
              | @sh
            ' osv_raw_report.json)
            OSV_SEVERITY_LOW_COUNT=$(echo $SEVERITY_COUNTS | cut -d' ' -f1)
            OSV_SEVERITY_MEDIUM_COUNT=$(echo $SEVERITY_COUNTS | cut -d' ' -f2)
            OSV_SEVERITY_HIGH_COUNT=$(echo $SEVERITY_COUNTS | cut -d' ' -f3)
            OSV_SEVERITY_UNKNOWN_COUNT=$(echo $SEVERITY_COUNTS | cut -d' ' -f4)
            echo "### The following vulnerabilities have been detected in the packages" >> osv_report.md
            echo "> LOW SEVERITY COUNT: $OSV_SEVERITY_LOW_COUNT" >> osv_report.md
            echo "MEDIUM SEVERITY COUNT: $OSV_SEVERITY_MEDIUM_COUNT" >> osv_report.md
            echo "HIGH SEVERITY COUNT: $OSV_SEVERITY_HIGH_COUNT" >> osv_report.md
            echo "UNKNOWN SEVERITY SCORE COUNT: $OSV_SEVERITY_UNKNOWN_COUNT" >> osv_report.md
            if (( OSV_SEVERITY_HIGH_COUNT > 0 || OSV_SEVERITY_UNKNOWN_COUNT > 0 )); then
              echo "### ${OSV_SEVERITY_HIGH_COUNT} HIGH SEVERITY Packaged found. Please resolve these before merging the pull request:<br>" >> osv_report.md
            else
              echo "### MEDIUM or LOW SEVERITY Packaged found:<br>" >> osv_report.md
            fi
            cat osv_raw_report.md >> osv_report.md
          else
            echo "### :tada:! There are no vulnerabilities found in the packages." >> osv_report.md
            cat osv_raw_report.md >> osv_report.md
          fi
          cat osv_report.md
          if [ $OSV_SEVERITY_HIGH_COUNT -gt 0 ]; then
            echo "::error::HIGH Severity Vulnerabilities or Unknown severity score found! Find the scan report in the PR comment if this scan was triggered by PR"
            exit 1
          elif [ $OSV_SEVERITY_MEDIUM_COUNT -gt 0 ]; then
            echo "::warning::MEDIUM or LOW Severity Vulnerabilities found! Find the scan report in the PR comment if this scan was triggered by PR"
            exit 0
          fi
      - name: Comment Dependency scan report on PR
        if: ${{ !cancelled() || contains('success,failure', steps.dependency_scan.outcome) }}
        uses: mshick/add-pr-comment@v2
        with:
          message-id: dependency_scan
          message-path: osv_report.md
