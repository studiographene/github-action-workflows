name: Pulse - SAST Analytics

on:
  workflow_call:
    inputs:
      PULSE_URL:
        type: string
        default: "https://a0lrn1xwl4.execute-api.eu-west-1.amazonaws.com"
      semgrep_options:
        type: string
        default: ""
      dev_test_branch:
        description: "Branch name(s) Pulse uses for this repo (comma separated). Empty means not configured."
        type: string
        default: ""
      before_step_command:
        type: string
        default: ""
      after_step_command:
        type: string
        default: ""

jobs:
  pulse_sast_report:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/studiographene/ci:node-22-alpine
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: before step
        if: ${{ inputs.before_step_command != '' }}
        run: |
          ${{ inputs.before_step_command}}
      - name: SAST Scan
        id: generate_report
        run: |
          cp /root/configs/semgrep/rules/eslint.v1.3.32.yml eslint.v1.3.32.yml
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan --config "p/default" --config eslint.v1.3.32.yml --json ${{ inputs.semgrep_options }} | tee semgrep.json
      - name: Fingerprint findings
        # Pulse matches a finding across scans by this hash: rule + file + the flagged lines with all
        # whitespace removed (so reformatting keeps it) + a counter for identical code in the same
        # file. Only the hash leaves CI, never the code. Secret-type rules hash a secret value, which
        # a plain hash would let anyone guess back, so they use an HMAC keyed with the org secret
        # PULSE_SAST_FINGERPRINT_KEY instead. Changing that key gives every secret finding a new id.
        env:
          PULSE_SAST_FINGERPRINT_KEY: ${{ secrets.PULSE_SAST_FINGERPRINT_KEY }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          // Bump only with a migration plan: every finding gets a new id in Pulse.
          const VERSION = 1;
          const SECRET_RULE = /secret|hardcode|credential|password|private-key|api-key/i;
          // TEMPORARY, for testing until the org secret is added. This repo is public, so with the
          // default the secret-rule hashes are no harder to guess than plain ones.
          const DEFAULT_KEY = 'pulse-sast-fingerprint-default-key';
          const secretKey = process.env.PULSE_SAST_FINGERPRINT_KEY || DEFAULT_KEY;
          if (secretKey === DEFAULT_KEY) {
            console.log('::warning::PULSE_SAST_FINGERPRINT_KEY is not set, secret-rule fingerprints use the default key');
          }
          const report = JSON.parse(fs.readFileSync('semgrep.json', 'utf8'));
          const results = Array.isArray(report.results) ? report.results : [];
          const files = new Map();
          const readLines = (path) => {
            if (!files.has(path)) {
              let lines = null;
              try {
                lines = fs.readFileSync(path, 'utf8').replace(/^﻿/, '').split(/\r\n|\r|\n/);
              } catch (error) {
                console.log(`Fingerprint skipped, cannot read ${path}`);
              }
              files.set(path, lines);
            }
            return files.get(path);
          };
          const seen = new Map();
          let fingerprinted = 0;
          // Line order, so the duplicate counter is assigned the same way on every run.
          [...results]
            .sort((a, b) => a.start.line - b.start.line || a.start.col - b.start.col)
            .forEach((result) => {
              result.extra = result.extra || {};
              const lines = readLines(result.path);
              if (!lines) {
                result.extra.fingerprint = null;
                return;
              }
              const code = lines
                .slice(result.start.line - 1, result.end.line)
                .join('')
                .replace(/\s+/g, '');
              const key = `${VERSION}|${result.check_id}|${result.path}|${code}`;
              const occurrence = (seen.get(key) || 0) + 1;
              seen.set(key, occurrence);
              const hash = SECRET_RULE.test(result.check_id)
                ? crypto.createHmac('sha256', secretKey)
                : crypto.createHash('sha256');
              result.extra.fingerprint = hash.update(`${key}|${occurrence}`).digest('hex');
              fingerprinted += 1;
            });
          report.fingerprintVersion = VERSION;
          fs.writeFileSync('semgrep.json', JSON.stringify(report));
          console.log(`Fingerprinted ${fingerprinted} of ${results.length} findings`);
          EOF
      - name: Display Errors
        id: display_errors
        env:
          # PR runs keep the existing base-branch behaviour; push runs now get a real branch
          BRANCH_NAME: ${{ github.event.pull_request.base.ref || github.ref_name }}
          REPO_NAME: ${{ github.repository }}
          ORG_ID: ${{ github.event.organization.id }}
          REPO_ID: ${{ github.repository_id }}
          # Production callers (nodejs-ci.yml) run this only for merged PRs: use the commit that landed on the base branch
          COMMIT_SHA: ${{ (github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha) || github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          DEV_TEST_BRANCH: ${{ inputs.dev_test_branch }}
          IS_DEFAULT_BRANCH: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch) }}
        run: |
          set -euo pipefail
          # Legacy v1 fields, unchanged shape so the existing consumer keeps working
          jq '[.results[] | {ruleId: .check_id, message: .extra.message, location: .path, lineNo: .start.line, snippet: .extra.lines}]' semgrep.json > temp_errors.json
          created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # null when dev_test_branch is not configured, so Pulse treats the scan's branch as unknown
          is_dev_test_branch=null
          if [ -n "$DEV_TEST_BRANCH" ]; then
            is_dev_test_branch=false
            for configured in $(printf %s "$DEV_TEST_BRANCH" | tr ',[]"' ' '); do
              if [ "$configured" = "$BRANCH_NAME" ]; then is_dev_test_branch=true; fi
            done
          fi
          # Superset: raw Semgrep JSON (results, version, ...) + legacy fields + v2 metadata
          jq \
            --arg date "$(date +%Y-%m-%d)" \
            --arg createdAt "$created_at" \
            --arg branch "$BRANCH_NAME" \
            --arg repo "$REPO_NAME" \
            --arg orgId "$ORG_ID" \
            --arg repoId "$REPO_ID" \
            --arg commitSha "$COMMIT_SHA" \
            --arg prNumber "$PR_NUMBER" \
            --arg mergedAt "$MERGED_AT" \
            --arg isDefault "$IS_DEFAULT_BRANCH" \
            --arg devTestBranch "$DEV_TEST_BRANCH" \
            --argjson isDevTestBranch "$is_dev_test_branch" \
            --slurpfile errors temp_errors.json \
            '. + {
               date: $date, createdAt: $createdAt, branch: $branch, repo: $repo,
               orgId: $orgId, repoId: $repoId, commitSha: $commitSha,
               prNumber: (if $prNumber == "" then null else ($prNumber | tonumber) end),
               mergedAt: (if $mergedAt == "" then null else $mergedAt end),
               isDefaultBranch: ($isDefault == "true"),
               devTestBranch: (if $devTestBranch == "" then null else $devTestBranch end),
               isDevTestBranch: $isDevTestBranch,
               errors: $errors[0]
             }' semgrep.json > pulse-security-errors-report.json
          echo "No. of error findings: $(jq '.results | length' semgrep.json)"

      - name: Upload SAST Errors Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-security-errors-report
          path: pulse-security-errors-report.json

      - name: after step
        if: ${{ inputs.after_step_command != '' }}
        run: |
          ${{ inputs.after_step_command}}
